name: full-research-verification
on:
  push:
    branches: [codex/unified-invariants-stress-flows]
    paths:
      - reports/degree12-map/map_certificate.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact computation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Record source and environment
        run: |
          mkdir -p reports/verification/full-checkout
          git rev-parse HEAD > reports/verification/full-checkout/source-commit.txt
          python --version > reports/verification/full-checkout/environment.txt
          python -m pip freeze >> reports/verification/full-checkout/environment.txt
      - name: Verify the complete research chain from this clean checkout
        run: make combined-full PYTHON=python
      - name: Retain raw logs, fresh computations and proof replays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-research-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
