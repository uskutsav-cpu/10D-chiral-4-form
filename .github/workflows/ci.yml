name: exact-research-tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact computation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify tests and packaged certificate arithmetic
        run: make verify PYTHON=python
      - name: Independent degree-six tensor reproduction
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: make smoke PYTHON=python
