[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chiral4form"
version = "0.3.0"
description = "Unified self-dual five-form invariant atlas and certified chiral four-form stress-flow research"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Utsav Sunil Kumar"}]
dependencies = ["numpy>=1.24,<3", "sympy>=1.12,<2", "opt_einsum>=3.4,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
chiral4form = "chiral4form.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: tensor/pipeline integration tests", "slow: optional larger tensor recomputations"]
